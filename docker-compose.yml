# Sextant, end to end. `docker compose up --build`, then http://localhost:7148
#
# This file is a WORKING EXAMPLE, not a production deployment. It ships a
# throwaway MongoDB and a local break-glass password so the thing runs out of
# the box. Read the two notes marked CHANGE THIS before pointing it anywhere
# real.

services:
  backend:
    build: ./backend
    environment:
      # CHANGE THIS. The break-glass password, and also the key that signs local
      # session tokens — so changing it invalidates every existing session,
      # which is the correct behaviour when you are rotating it deliberately.
      SEXTANT_PASSWORD: change-me-before-you-use-this
      SEXTANT_CONFIG: /config/sextant.yml
    volumes:
      - ./examples/sextant.yml:/config/sextant.yml:ro
      # The audit log. A named volume, not a bind mount into the image: an audit
      # trail that lives only inside the container disappears with it, and the
      # one time you want it is after something went wrong.
      - audit:/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7145/ready').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:7145
    ports:
      - "7148:7148"
    depends_on:
      backend:
        condition: service_healthy

  # A throwaway MongoDB so the example config works unedited.
  # CHANGE THIS: point the config at your own and delete this service.
  mongo:
    image: mongo:7
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  audit:
  mongo:
